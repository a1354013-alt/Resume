      rel="stylesheet"
    />

    <!-- GitHub Pages SPA fallback:
         - `client/public/404.html` redirects deep links to `/?p=/deep/link`
         - This script restores the original path on first load. -->
    <script>
      (function () {
        try {
          var search = window.location.search;
          if (!search || search.length < 2) return;
          var params = new URLSearchParams(search);
          var p = params.get("p");
          if (!p) return;
          var q = params.get("q") || "";
          var newUrl =
            window.location.pathname.replace(/\/+$/, "") +
            p +
            (q ? "?" + q : "") +
            window.location.hash;
          window.history.replaceState(null, "", newUrl);
        } catch (e) {
          // no-op
        }
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div
        class="loading-screen"
        role="status"
        aria-live="polite"
        aria-label="Loading portfolio..."
      >
        <div class="loading-screen__orbital" aria-hidden="true">
          <span class="loading-screen__ring loading-screen__ring--outer"></span>
          <span
            class="loading-screen__ring loading-screen__ring--middle"
          ></span>
          <span class="loading-screen__ring loading-screen__ring--inner"></span>
          <span class="loading-screen__core"></span>
        </div>
        <p class="loading-screen__text">Loading portfolio...</p>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
